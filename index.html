<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea Cozy</title>
    <link rel="stylesheet" href="resources/css/style.css">
</head>
<body>
    <!-- Header -->

    <header>
        <img src="resources/images/img-tea-cozy-logo.png" alt="Tea Cozy Logo" class="logo">
        <nav>
            <ul>
                <li><a href="#mission">Mission</a></li>
                <li><a href="#featured-tea">Featured Tea</a></li>
                <li><a href="#locations">Locations</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->

    <main class="flex-col">

        <!-- Mission Section -->

        <section id="mission" class="flex-col">
            <div class="overlay flex-col flex-gap">
                <h2>Our Mission</h2>
                <h4>Handpicked, Artisanally Curated, Free Range, Sustainable, Small Batch, Fair Trade, Organic Tea</h4>
            </div>
        </section>

        <!-- Featured Tea Section -->

        <section id="featured-tea" class="flex-col flex-gap">
            <h2>Tea of the Month</h2>
            <h3>What's Steeping at The Tea Cozy?</h3>
            <div class="card-container">
                <div class="card">
                    <img src="resources/images/img-berryblitz.jpg" alt="Fall Berry Blitz Tea">
                    <h3>Fall Berry Blitz Tea</h3>
                </div>
                <div class="card">
                    <img src="resources/images/img-spiced-rum.jpg" alt="Spiced Rum Tea">
                    <h3>Spiced Rum Tea</h3>
                </div>
                <div class="card">
                    <img src="resources/images/img-donut.jpg" alt="Seasonal Donuts">
                    <h3>Seasonal Donuts</h3>
                </div>
                <div class="card">
                    <img src="resources/images/img-myrtle-ave.jpg" alt="Myrtle Ave Tea">
                    <h3>Myrtle Ave Tea</h3>
                </div>
                <div class="card">
                    <img src="resources/images/img-bedford-bizarre.jpg" alt="Bedford Bizarre Tea">
                    <h3>Bedford Bizarre Tea</h3>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
